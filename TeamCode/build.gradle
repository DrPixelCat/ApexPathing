//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    compileSdk 35
    defaultConfig {
        minSdk 24
    }

    testOptions.unitTests.all {
        // Headless alpha.1 physics identifies its missing-viewer exception by call site.
        // HotSpot otherwise drops that stack trace after repeated updates.
        jvmArgs '-XX:-OmitStackTraceInFastThrow'
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')

    // FTCodeSim is a desktop-only development tool. Keeping it on the unit-test classpath avoids
    // packaging simulator/desktop dependencies into the Robot Controller APK.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.knowm.xchart:xchart:4.0.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'org.codeblooded.ftcodesim:ftcodesim:v0.1.0-alpha.1'
    // Execute the real Road Runner controller/profile implementation in desktop comparisons.
    testImplementation 'com.acmerobotics.roadrunner:core:1.0.1'
}

repositories {
    maven { url = 'https://maven.brott.dev/' }
}
